<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SKYSEF 2026 IJP</title>
  <meta http-equiv="refresh" content="0;url=https://script.google.com/macros/s/AKfycbxCP7Yb2_xw6PRdPOiFhRAMokDA9OEmR12fHjn57I5Mz_BGxF3_Nv8XYrf95xWKB-WrpA/exec">
  <style>
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#111}
    main{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
    a{color:#2d7c29;font-weight:900}
  </style>
</head>
<body>
  <main>
    <div>
      <h1>SKYSEF 2026</h1>
      <p>Opening the International Joint Project system...</p>
      <p><a id="openLink" href="https://script.google.com/macros/s/AKfycbxCP7Yb2_xw6PRdPOiFhRAMokDA9OEmR12fHjn57I5Mz_BGxF3_Nv8XYrf95xWKB-WrpA/exec">Open the system</a></p>
    </div>
  </main>
  <script>
    const target = new URL("https://script.google.com/macros/s/AKfycbxCP7Yb2_xw6PRdPOiFhRAMokDA9OEmR12fHjn57I5Mz_BGxF3_Nv8XYrf95xWKB-WrpA/exec");
    const current = new URL(window.location.href);

    current.searchParams.forEach((value, key) => {
      target.searchParams.set(key, value);
    });

    target.hash = current.hash;
    document.getElementById('openLink').href = target.toString();
    window.location.replace(target.toString());
  </script>
</body>
</html>
