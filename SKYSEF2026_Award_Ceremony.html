<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKYSEF 2026 Award Ceremony</title>
  <style>
    :root {
      --ink: #11233d;
      --blue: #174f8f;
      --blue-soft: #eaf3fb;
      --gold: #bd8a22;
      --gold-light: #ead49c;
      --green: #22bd08;
      --red: #ff2631;
      --gray: #617087;
      --line: #d8e0ea;
      --paper: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { font-family: "Aptos", "Segoe UI", Arial, sans-serif; color: var(--ink); background: white; }
    .deck { position: relative; width: 100vw; height: 100vh; background: white; }
    .slide {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(24px, 3.4vw, 62px) clamp(38px, 6vw, 112px) clamp(25px, 3vw, 52px);
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transform: translateY(12px);
      transition: opacity .5s ease, transform .5s ease, visibility .5s;
      background:
        radial-gradient(circle at 92% 92%, rgba(23,79,143,.075), transparent 28%),
        radial-gradient(circle at 7% 8%, rgba(189,138,34,.055), transparent 23%),
        var(--paper);
    }
    .slide::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 9px;
      background: linear-gradient(180deg, var(--gold), var(--blue));
    }
    .slide::after {
      content: "";
      position: absolute;
      right: clamp(28px, 4vw, 70px);
      top: clamp(24px, 3.4vw, 62px);
      width: clamp(70px, 8vw, 135px);
      height: 1px;
      background: var(--gold);
    }
    .slide.active { opacity: 1; visibility: visible; transform: translateY(0); z-index: 2; }

    .header { display: flex; align-items: flex-start; justify-content: space-between; gap: 30px; z-index: 1; }
    .logo { display: block; width: clamp(250px, 27vw, 470px); height: auto; mix-blend-mode: multiply; }
    .event {
      margin-top: 16px;
      padding-right: clamp(90px, 10vw, 165px);
      color: var(--gray);
      text-align: right;
      font-size: clamp(11px, .9vw, 16px);
      font-weight: 650;
      letter-spacing: .18em;
      line-height: 1.55;
    }
    .content { align-self: center; width: min(1500px, 100%); margin: 0 auto; z-index: 1; }
    .center { text-align: center; }
    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      color: var(--blue);
      font-size: clamp(15px, 1.3vw, 23px);
      font-weight: 750;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    .kicker::before { content: ""; width: 44px; height: 2px; background: var(--gold); }
    .center .kicker::after { content: ""; width: 44px; height: 2px; background: var(--gold); }
    h1, h2, p { margin: 0; }
    .display {
      margin-top: clamp(18px, 2.5vh, 34px);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(60px, 8.2vw, 142px);
      line-height: .98;
      font-weight: 500;
      letter-spacing: -.035em;
      text-wrap: balance;
    }
    .gold { color: var(--gold); }
    .opening-sub { margin-top: 27px; color: var(--gray); font-size: clamp(18px, 1.7vw, 29px); letter-spacing: .13em; }

    .award-number {
      margin-bottom: clamp(18px, 2.6vh, 35px);
      color: var(--blue);
      font-size: clamp(18px, 1.6vw, 28px);
      font-weight: 800;
      letter-spacing: .24em;
      text-transform: uppercase;
    }
    .award-number span {
      display: inline-block;
      margin-right: 15px;
      padding: 7px 15px;
      border: 1px solid var(--gold-light);
      border-radius: 999px;
      color: var(--gold);
      letter-spacing: .08em;
    }
    .award-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(67px, 9vw, 154px);
      line-height: .93;
      font-weight: 500;
      letter-spacing: -.045em;
    }
    .award-category { margin-top: 28px; color: var(--gray); font-size: clamp(18px, 1.65vw, 29px); letter-spacing: .17em; text-transform: uppercase; }

    .highlight-grid { display: block; width: min(1250px, 100%); margin: 0 auto; }
    .mark {
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      border: 2px solid var(--gold);
      border-radius: 50%;
      color: var(--gold);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(39px, 4.8vw, 78px);
      box-shadow: 0 0 0 13px rgba(189,138,34,.055);
    }
    .highlight-title {
      margin-top: 16px;
      color: var(--gray);
      font-size: clamp(19px, 1.7vw, 29px);
      line-height: 1.2;
      font-weight: 650;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .summary {
      margin-top: clamp(25px, 3.4vh, 45px);
      padding-left: 24px;
      border-left: 4px solid var(--gold);
      color: #34475f;
      font-size: clamp(23px, 2.15vw, 37px);
      line-height: 1.48;
      text-wrap: balance;
    }

    .recipient { display: grid; grid-template-columns: 1fr auto; gap: clamp(35px, 5vw, 90px); align-items: center; }
    .research-title {
      margin-top: 22px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 3.5vw, 59px);
      line-height: 1.13;
      font-weight: 500;
      text-wrap: balance;
    }
    .school {
      margin-top: clamp(25px, 3.2vh, 44px);
      color: var(--blue);
      font-size: clamp(22px, 2vw, 34px);
      line-height: 1.3;
      font-weight: 700;
    }
    .person {
      margin-top: 13px;
      color: var(--gray);
      font-size: clamp(21px, 1.8vw, 31px);
      line-height: 1.3;
    }
    .person.empty { color: #8a96a6; font-style: italic; }
    .medallion {
      display: grid;
      place-items: center;
      width: clamp(170px, 19vw, 300px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: linear-gradient(145deg, #f8edcd, #c89a35);
      color: white;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(37px, 4vw, 68px);
      text-align: center;
      box-shadow: 0 20px 50px rgba(126,92,25,.18);
    }
    .medallion small { display: block; margin-top: 5px; font: 700 clamp(11px, .9vw, 16px)/1.2 "Aptos", Arial, sans-serif; letter-spacing: .16em; }

    .footer { display: flex; justify-content: space-between; align-items: end; color: #8491a3; font-size: clamp(10px, .78vw, 14px); letter-spacing: .12em; z-index: 1; }
    .controls {
      position: fixed; left: 50%; bottom: 17px; transform: translateX(-50%); z-index: 10;
      display: flex; gap: 8px; opacity: .94; transition: opacity .45s;
    }
    .controls.idle { opacity: 0; }
    button {
      border: 1px solid #c9d3df; border-radius: 999px; padding: 8px 16px;
      color: var(--ink); background: rgba(255,255,255,.92); box-shadow: 0 5px 20px rgba(17,35,61,.08);
      cursor: pointer; font: inherit;
    }
    button:hover { border-color: var(--gold); color: var(--gold); }
    @media (max-aspect-ratio: 4/3) {
      .highlight-grid { grid-template-columns: 1fr; gap: 25px; }
      .mark { width: 125px; }
      .recipient { grid-template-columns: 1fr; }
      .medallion { display: none; }
      .event { display: none; }
    }
    @media print {
      html, body { overflow: visible; }
      .deck { height: auto; }
      .slide { position: relative; width: 13.333in; height: 7.5in; opacity: 1; visibility: visible; transform: none; page-break-after: always; }
      .controls { display: none; }
    }
  </style>
</head>
<body>
  <main class="deck" id="deck"></main>
  <nav class="controls" id="controls" aria-label="Slide controls">
    <button type="button" id="prev">← Previous</button>
    <button type="button" id="next">Next →</button>
    <button type="button" id="full">Full Screen</button>
  </nav>
